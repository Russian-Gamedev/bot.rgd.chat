name: rgd.chat

services:
  database:
    image: postgres:18-alpine
    container_name: "${COMPOSE_PROJECT_NAME}_database"
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql:/var/lib/postgresql/18/docker
  redis:
    image: "redis:alpine"
    container_name: "${COMPOSE_PROJECT_NAME}_redis"
    command: "redis-server --appendonly yes"
    restart: unless-stopped
    ports:
      - "6379:6379"
  minio:
    image: "quay.io/minio/minio:latest"
    container_name: "${COMPOSE_PROJECT_NAME}_minio"
    command: "server /data --console-address :9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Direct browser uploads (presigned PUT) from the local frontend
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio:/data
  minio-init:
    image: "quay.io/minio/mc:latest"
    container_name: "${COMPOSE_PROJECT_NAME}_minio_init"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/golder;
      mc anonymous set download local/golder;
      echo 'minio initialized';
      "
